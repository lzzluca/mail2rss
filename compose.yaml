services:
  mail2rss:
    build: .
    restart: unless-stopped
    volumes:
      - ./secrets:/app/secrets:ro
    networks:
      - freshrss
    # No ports published: only containers on the FreshRSS network can reach the feeds,
    # at http://mail2rss:8080/<sender>.xml

networks:
  freshrss:
    external: true
    name: freshrss_default
